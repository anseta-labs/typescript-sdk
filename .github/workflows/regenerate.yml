name: Regenerate SDK

# Regenerates src/ from the deployed OpenAPI spec and opens a PR when anything
# changed. It never pushes to main: a spec change can rename a generated type
# without breaking compilation inside this repo, so the diff needs a human.

on:
  schedule:
    # Monday 06:00 UTC. The safety net, not the primary trigger.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      spec_url:
        description: OpenAPI spec to generate from
        required: false
        default: https://preview.api.stakefi.network/v1/openapi.json
  repository_dispatch:
    # Sent by the API repository once it publishes its spec. Optional payload:
    # { "spec_url": "https://..." }
    types: [spec-updated]

concurrency:
  group: regenerate-sdk
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  DEFAULT_SPEC_URL: https://preview.api.stakefi.network/v1/openapi.json

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # openapi-generator-cli is a Node wrapper around a Java jar.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve spec source
        id: source
        run: |
          URL="${{ github.event.inputs.spec_url || github.event.client_payload.spec_url || env.DEFAULT_SPEC_URL }}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Generating from $URL"

      - name: Keep a copy of the current spec
        run: cp openapi.json /tmp/openapi.previous.json

      - name: Regenerate
        env:
          ANSETA_SPEC: ${{ steps.source.outputs.url }}
        # prepare-spec.mjs validates the document and pins `servers` before the
        # generator runs, so a 404 page or an empty spec fails here.
        run: pnpm run generate

      - name: Check for changes
        id: changed
        run: |
          if git diff --quiet -- openapi.json src; then
            echo "result=false" >> "$GITHUB_OUTPUT"
            echo "Spec and generated client are unchanged."
          else
            echo "result=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare specs
        id: diff
        if: steps.changed.outputs.result == 'true'
        run: |
          node scripts/spec-diff.mjs \
            --previous /tmp/openapi.previous.json \
            --current openapi.json

      - name: Record the change in the CHANGELOG
        if: steps.changed.outputs.result == 'true'
        run: |
          cat <<'ENTRY' | node scripts/changelog.mjs add
          ${{ steps.diff.outputs.changelog }}
          ENTRY

      # Gates the PR on the client compiling. typecheck:examples is the useful
      # one: the examples exercise real method names, so a rename fails here.
      - name: Typecheck and build
        if: steps.changed.outputs.result == 'true'
        run: |
          pnpm run typecheck
          pnpm run typecheck:examples
          pnpm run build

      - name: Open pull request
        if: steps.changed.outputs.result == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/regenerate-sdk
          delete-branch: true
          commit-message: "chore: regenerate SDK from spec ${{ steps.diff.outputs.spec_version }}"
          title: "chore: regenerate SDK from spec ${{ steps.diff.outputs.spec_version }}"
          labels: ${{ steps.diff.outputs.breaking == 'true' && 'automated, breaking' || 'automated' }}
          body: |
            Regenerated from `${{ steps.source.outputs.url }}`.

            ${{ steps.diff.outputs.summary }}

            ---
            Generated by `.github/workflows/regenerate.yml`. The contents of `src/`
            are produced by OpenAPI Generator: fix problems in the API spec, not here.
